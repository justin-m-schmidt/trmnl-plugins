---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.1.1
serverless_language: node
refresh_interval_floor:
polling_url: https://api.chess.com/pub/player/{{ username }}/stats
polling_headers:
polling_body:
id: 371719
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: username
  field_type: string
  name: Username
  description: Find this in your chess.com profile.
  placeholder: hikaru
- keyname: doesnt_matter
  name: About This Plugin
  category: education,personal
  field_type: author_bio
  description: Show stats from your chess.com profile. Created by Justin (github.com/justin-m-schmidt).
  github_url: https://github.com/justin-m-schmidt
name: Chess.com
description: Ratings, records and win rates
refresh_interval: 15
